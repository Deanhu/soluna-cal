# SolunaCal Xcode 工程定义
# 本文件是 .xcodeproj 的唯一真源：改工程结构只改这里，再跑 `xcodegen`。
# 说明：LunarCore / SolunaUI 以 framework target 直编（与 SwiftPM 共用同一份源码），
# 不通过 Xcode 的 SwiftPM 集成——本机环境禁止嵌套 sandbox，xcodebuild 无法跑 SwiftPM 解析；
# 模块边界由命令行 `swift build / swift test`（Package.swift）继续强制保证。

name: SolunaCal
options:
  bundleIdPrefix: com.soluna
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  LunarCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/LunarCore
    settings:
      base:
        PRODUCT_NAME: LunarCore
        PRODUCT_BUNDLE_IDENTIFIER: com.soluna.lunarcore
        GENERATE_INFOPLIST_FILE: YES
        INSTALL_PATH: "@rpath"
      configs:
        debug:
          ENABLE_TESTABILITY: YES

  SolunaUI:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SolunaUI
    dependencies:
      - target: LunarCore
    settings:
      base:
        PRODUCT_NAME: SolunaUI
        PRODUCT_BUNDLE_IDENTIFIER: com.soluna.solunaui
        GENERATE_INFOPLIST_FILE: YES
        INSTALL_PATH: "@rpath"
      configs:
        debug:
          ENABLE_TESTABILITY: YES

  SolunaCal:
    type: application
    platform: macOS
    sources:
      - path: Sources/SolunaCal
    dependencies:
      - target: SolunaUI
        embed: true
      - target: LunarCore
        embed: true
      - target: SolunaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soluna.cal
        PRODUCT_NAME: SolunaCal
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        # 应用图标（Sources/SolunaCal/Assets.xcassets/AppIcon）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 菜单栏纯配件应用：不出现在 Dock
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "SolunaCal"
        INFOPLIST_KEY_NSCalendarsUsageDescription: "读取日程用于月历展示；双击日期可创建事件写回系统日历"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "真太阳时校正需要一次定位获取经度；拒绝则按东八区中央经线计算"
        CURRENT_PROJECT_VERSION: "27"
        MARKETING_VERSION: "0.4.2"

  SolunaWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/SolunaWidget
      - path: Sources/LunarCore   # 历法引擎直接编进扩展（内置数据表，无需跨进程共享）
    settings:
      base:
        PRODUCT_NAME: SolunaWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.soluna.cal.widget
        INFOPLIST_FILE: Sources/SolunaWidget/Info.plist
        CURRENT_PROJECT_VERSION: "27"
        MARKETING_VERSION: "0.4.2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES

  LunarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LunarCoreTests
    dependencies:
      - target: LunarCore
      - target: SolunaUI
    settings:
      base:
        PRODUCT_NAME: LunarCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SolunaCal:
    build:
      targets:
        SolunaCal: all
        LunarCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LunarCoreTests
